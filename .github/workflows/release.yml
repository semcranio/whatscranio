name: Build macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test-intel:
    runs-on: macos-15-intel
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run tests on Intel
        run: swift test

  build:
    needs: test-intel
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Run tests
        run: swift test

      - name: Package DMG
        run: ./scripts/package-dmg.sh

      - name: Verify Universal 2 application
        run: lipo "dist/WhatsCrânio.app/Contents/MacOS/WhatsCranio" -verify_arch arm64 x86_64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsCranio-macOS
          path: |
            dist/WhatsCranio-macOS.dmg
            dist/WhatsCranio-macOS.dmg.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/WhatsCranio-macOS.dmg
          dist/WhatsCranio-macOS.dmg.sha256
          --title "WhatsCrânio $GITHUB_REF_NAME"
          --generate-notes
